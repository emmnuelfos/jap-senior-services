<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>J.A.P. Senior Care Services — Presented by TaskFlo</title>
  <meta name="description" content="Two complete web design directions for J.A.P. Senior Care Services, presented by TaskFlo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================
       J.A.P. Presentation — Cover
       Standalone deck, dark navy stage, device-mockup hero
       ===================================================== */
    :root {
      --navy-deep:  #04102e;
      --navy:       #0A1F4E;
      --navy-glow:  #1B3A7E;
      --ink:        #E8ECF7;
      --ink-soft:   #9FA9C6;
      --accent:     #FF6B6B;     /* red used in TaskFlo check */
      --f-display:  "Inter", "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --f-body:     "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --ease:       cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--navy-deep);
      color: var(--ink);
      font-family: var(--f-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }

    /* ----- STAGE ----- */
    .slide-cover {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      isolation: isolate;
    }
    /* Layered background: navy → subtle radial glow on the right
       where the device cluster sits. Adds depth without busy noise. */
    .slide-cover::before,
    .slide-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .slide-cover::before {
      background:
        radial-gradient(1100px 720px at 78% 50%, rgba(38, 86, 188, 0.45), transparent 65%),
        radial-gradient(720px 480px at 92% 14%, rgba(56, 116, 220, 0.30), transparent 60%),
        radial-gradient(900px 640px at 6% 96%, rgba(8, 24, 64, 0.65), transparent 55%);
    }
    .slide-cover::after {
      background:
        linear-gradient(180deg, rgba(4,16,46,0.0) 60%, rgba(4,16,46,0.55) 100%);
    }

    /* TaskFlo brand corner */
    .brand {
      position: absolute;
      top: clamp(28px, 4vw, 56px);
      left: clamp(28px, 4vw, 56px);
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-12px);
      animation: coverEnter 900ms var(--ease) 80ms forwards;
    }
    .brand img {
      height: 32px;
      width: auto;
      /* Supplied PNG is white-on-transparent + a red check; invert
         keeps it white on this dark stage. */
      filter: brightness(0) invert(1);
    }

    /* ----- TWO-COLUMN BODY ----- */
    .cover-grid {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: clamp(120px, 14vh, 180px) clamp(28px, 6vw, 96px) clamp(60px, 8vh, 100px);
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      gap: clamp(24px, 4vw, 64px);
      align-items: center;
      min-height: 100vh;
    }

    /* ----- LEFT: COPY ----- */
    .cover-copy { position: relative; max-width: 560px; }
    .cover-eyebrow {
      font-family: var(--f-body);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      transform: translateY(12px);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(28px, 4vh, 36px);
    }
    .cover-eyebrow::before {
      content: "";
      width: 36px;
      height: 1.5px;
      background: var(--accent);
      display: inline-block;
    }
    .cover-title {
      font-family: var(--f-display);
      font-weight: 800;
      font-size: clamp(48px, 6.4vw, 92px);
      line-height: 1.02;
      letter-spacing: -0.025em;
      color: #fff;
      margin: 0 0 clamp(28px, 4vh, 40px);
      text-wrap: balance;
    }
    .cover-title .line { display: block; overflow: hidden; }
    .cover-title .line > span {
      display: inline-block;
      transform: translateY(110%);
      opacity: 0;
      will-change: transform, opacity;
    }
    .cover-copy p {
      font-family: var(--f-body);
      font-size: clamp(15px, 1.05vw, 17px);
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 48ch;
      margin: 0 0 clamp(36px, 6vh, 56px);
      opacity: 0;
      transform: translateY(18px);
    }

    /* ----- ENTER PRESENTATION button ----- */
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-family: var(--f-body);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      transform: translateY(18px);
      transition: color 250ms var(--ease), transform 250ms var(--ease);
      cursor: pointer;
    }
    .enter-btn .enter-ring {
      width: 44px;
      height: 44px;
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 250ms var(--ease), background 250ms var(--ease), transform 350ms var(--ease);
    }
    .enter-btn .enter-ring svg {
      width: 14px;
      height: 14px;
      transition: transform 350ms var(--ease);
    }
    .enter-btn:hover { color: #fff; transform: translateY(-1px); }
    .enter-btn:hover .enter-ring {
      background: var(--accent);
      border-color: var(--accent);
    }
    .enter-btn:hover .enter-ring svg { transform: translateX(3px); }

    /* ----- RIGHT: DEVICE COMPOSITION ----- */
    .cover-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 11 / 9;
      perspective: 1600px;
    }
    .device {
      position: absolute;
      will-change: transform, opacity;
      opacity: 0;
      filter: drop-shadow(0 40px 80px rgba(0, 0, 0, 0.55));
    }
    .device img { width: 100%; height: auto; display: block; }

    /* Layered composition mirroring the cover comp. Each device gets
       a translate3d origin off to the right so the entry feels like
       the devices flew in from off-stage. */
    .device--laptop-1 {
      width: 72%;
      top: 6%;
      left: 8%;
      z-index: 2;
      transform: translate3d(60px, 30px, 0) rotateY(-6deg);
    }
    .device--mobile-1 {
      width: 18%;
      bottom: 8%;
      left: 14%;
      z-index: 4;
      transform: translate3d(80px, 50px, 0) rotateZ(-4deg);
    }
    .device--laptop-2 {
      width: 50%;
      top: 28%;
      right: 0%;
      z-index: 1;
      transform: translate3d(120px, 60px, 0) rotateY(8deg);
    }
    .device--mobile-2 {
      width: 22%;
      bottom: 4%;
      right: 8%;
      z-index: 3;
      transform: translate3d(100px, 80px, 0) rotateZ(6deg);
    }

    /* ----- KEYFRAMES + ENTRANCE TRIGGERS ----- */
    @keyframes coverEnter        { to { opacity: 1; transform: translateY(0); } }
    @keyframes titleLineUp       { to { transform: translateY(0); opacity: 1; } }
    @keyframes deviceFlyLaptop1  { to { opacity: 1; transform: translate3d(0,0,0) rotateY(-6deg); } }
    @keyframes deviceFlyMobile1  { to { opacity: 1; transform: translate3d(0,0,0) rotateZ(-4deg); } }
    @keyframes deviceFlyLaptop2  { to { opacity: 1; transform: translate3d(0,0,0) rotateY(8deg);  } }
    @keyframes deviceFlyMobile2  { to { opacity: 1; transform: translate3d(0,0,0) rotateZ(6deg);  } }

    /* Trigger animations after the page is ready. Without rAF the
       initial state would have already been overwritten by the time
       the browser kicks the animation off. */
    body.is-ready .cover-eyebrow { animation: coverEnter 800ms var(--ease) 200ms forwards; }
    body.is-ready .cover-title .line > span { animation: titleLineUp 1100ms var(--ease) forwards; }
    body.is-ready .cover-title .line:nth-child(1) > span { animation-delay: 380ms; }
    body.is-ready .cover-title .line:nth-child(2) > span { animation-delay: 520ms; }
    body.is-ready .cover-copy p { animation: coverEnter 800ms var(--ease) 880ms forwards; }
    body.is-ready .enter-btn { animation: coverEnter 800ms var(--ease) 1080ms forwards; }
    body.is-ready .device--laptop-1 { animation: deviceFlyLaptop1 1300ms var(--ease) 320ms forwards; }
    body.is-ready .device--mobile-1 { animation: deviceFlyMobile1 1300ms var(--ease) 560ms forwards; }
    body.is-ready .device--laptop-2 { animation: deviceFlyLaptop2 1300ms var(--ease) 460ms forwards; }
    body.is-ready .device--mobile-2 { animation: deviceFlyMobile2 1300ms var(--ease) 720ms forwards; }

    /* ----- AMBIENT GLINT (the bright top-right glow visible in the comp) ----- */
    .glint {
      position: absolute;
      top: -10%; right: -10%;
      width: 60%; height: 60%;
      background: radial-gradient(closest-side, rgba(255,255,255,0.12), transparent 70%);
      filter: blur(20px);
      pointer-events: none;
      z-index: 1;
      animation: glintPulse 6s ease-in-out infinite;
    }
    @keyframes glintPulse {
      0%,100% { opacity: 0.6; transform: scale(1); }
      50%     { opacity: 1.0; transform: scale(1.05); }
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 980px) {
      .cover-grid {
        grid-template-columns: 1fr;
        gap: clamp(40px, 6vh, 72px);
        padding-top: clamp(120px, 16vh, 200px);
      }
      .cover-stage {
        order: 2;
        max-width: 580px;
        margin: 0 auto;
        width: 100%;
      }
      .cover-title { font-size: clamp(38px, 9vw, 64px); }
    }
    @media (max-width: 560px) {
      .brand img { height: 26px; }
      .cover-grid { padding: clamp(100px, 14vh, 140px) 24px 60px; }
      .cover-eyebrow { font-size: 11.5px; letter-spacing: 0.28em; }
      .cover-title { font-size: clamp(34px, 11vw, 52px); }
      .device--laptop-1 { width: 78%; }
      .device--mobile-1 { width: 20%; }
      .device--laptop-2 { width: 56%; }
      .device--mobile-2 { width: 24%; }
    }

    /* Reduced motion — keep things readable, kill drift. */
    @media (prefers-reduced-motion: reduce) {
      body.is-ready * { animation: none !important; transition: none !important; }
      .cover-title .line > span,
      .cover-copy p,
      .cover-eyebrow,
      .enter-btn,
      .device,
      .brand { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>

  <main class="slide-cover" aria-label="Cover slide">
    <div class="glint" aria-hidden="true"></div>

    <!-- TaskFlo wordmark in the corner -->
    <a class="brand" href="#" aria-label="TaskFlo">
      <img src="assets/img/cover/taskflo-logo.png" alt="TaskFlo" />
    </a>

    <div class="cover-grid">
      <!-- LEFT: Brand copy -->
      <div class="cover-copy">
        <div class="cover-eyebrow">February 2026</div>
        <h1 class="cover-title">
          <span class="line"><span>J.A.P. Senior</span></span>
          <span class="line"><span>Care Services</span></span>
        </h1>
        <p>Two complete web design directions for J.A.P. Senior Care Services — built with the warmth, dignity, and clinical confidence the brand was founded on. Every page, every breakpoint, ready to ship.</p>
        <a class="enter-btn" href="#deck" aria-label="Enter presentation">
          <span class="enter-ring" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </span>
          <span>Enter Presentation</span>
        </a>
      </div>

      <!-- RIGHT: Device composition -->
      <div class="cover-stage" aria-hidden="true">
        <div class="device device--laptop-2"><img src="assets/img/cover/laptop-2.png" alt="" /></div>
        <div class="device device--laptop-1"><img src="assets/img/cover/laptop-1.png" alt="" /></div>
        <div class="device device--mobile-2"><img src="assets/img/cover/mobile-2.png" alt="" /></div>
        <div class="device device--mobile-1"><img src="assets/img/cover/mobile-1.png" alt="" /></div>
      </div>
    </div>
  </main>

  <script>
    // Two rAFs so the keyframes start from their declared "from" state.
    // Without this the browser may already have committed the post-
    // animation state before the rule cascades in.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.body.classList.add('is-ready');
      });
    });
  </script>
</body>
</html>
