<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>J.A.P. Senior Care Services — Presented by TaskFlo</title>
  <meta name="description" content="Two complete web design directions for J.A.P. Senior Care Services, presented by TaskFlo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================
       J.A.P. Presentation — Cover (matches reference 1:1)
       ===================================================== */
    :root {
      --bg-deep:   #050E28;
      --bg:        #0B1B45;
      --bg-glow:   #1A3A85;
      --ink:       #FFFFFF;
      --ink-soft:  #98A3BE;
      --ink-mute:  #5C6989;
      --accent:    #FF4A4A;       /* TaskFlo red */
      --ease:      cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-deep);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }

    /* ----- STAGE ----- */
    .slide {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(1400px 900px at 78% 38%, rgba(36, 78, 180, 0.55), transparent 60%),
        radial-gradient(800px 600px at 96% 6%, rgba(70, 130, 230, 0.45), transparent 55%),
        radial-gradient(600px 400px at 0% 100%, rgba(8, 16, 48, 0.7), transparent 60%),
        linear-gradient(135deg, #050C24 0%, #0A1A42 55%, #102556 100%);
    }

    /* ----- TASKFLO LOGO ----- */
    .brand {
      position: absolute;
      top: clamp(28px, 3.5vw, 56px);
      left: clamp(28px, 4vw, 64px);
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-12px);
    }
    .brand img {
      height: 28px;
      width: auto;
      filter: brightness(0) invert(1);
    }
    body.is-ready .brand {
      animation: fadeDown 800ms var(--ease) 100ms forwards;
    }

    /* ----- LAYOUT ----- */
    .cover {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: clamp(120px, 14vh, 160px) clamp(28px, 5vw, 80px) clamp(60px, 8vh, 100px);
      display: grid;
      grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr);
      gap: clamp(32px, 5vw, 80px);
      align-items: center;
    }

    /* ----- LEFT: COPY ----- */
    .copy { position: relative; max-width: 540px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: clamp(28px, 4vh, 42px);
      opacity: 0;
      transform: translateY(14px);
    }
    .eyebrow::before {
      content: "";
      width: 30px;
      height: 2px;
      background: var(--accent);
      display: inline-block;
    }
    body.is-ready .eyebrow {
      animation: fadeUp 800ms var(--ease) 220ms forwards;
    }

    .title {
      font-family: "Inter", sans-serif;
      font-weight: 800;
      font-size: clamp(48px, 6vw, 88px);
      line-height: 1.0;
      letter-spacing: -0.035em;
      color: var(--ink);
      margin: 0 0 clamp(28px, 4vh, 40px);
    }
    .title .line {
      display: block;
      overflow: hidden;
      padding-bottom: 0.04em;
    }
    .title .line > span {
      display: inline-block;
      transform: translateY(105%);
      opacity: 0;
      will-change: transform, opacity;
    }
    body.is-ready .title .line:nth-child(1) > span {
      animation: titleUp 1100ms var(--ease) 380ms forwards;
    }
    body.is-ready .title .line:nth-child(2) > span {
      animation: titleUp 1100ms var(--ease) 500ms forwards;
    }

    .lede {
      font-family: "Inter", sans-serif;
      font-size: clamp(14px, 1vw, 15.5px);
      line-height: 1.7;
      font-weight: 400;
      color: var(--ink-soft);
      max-width: 38ch;
      margin: 0 0 clamp(40px, 7vh, 64px);
      opacity: 0;
      transform: translateY(18px);
    }
    body.is-ready .lede {
      animation: fadeUp 800ms var(--ease) 880ms forwards;
    }

    /* ----- ENTER PRESENTATION ----- */
    .enter {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0;
      transform: translateY(18px);
      transition: color 250ms var(--ease), transform 250ms var(--ease);
      cursor: pointer;
    }
    body.is-ready .enter {
      animation: fadeUp 800ms var(--ease) 1080ms forwards;
    }
    .enter .ring {
      width: 38px;
      height: 38px;
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 250ms var(--ease), background 250ms var(--ease), transform 350ms var(--ease);
    }
    .enter .ring svg {
      width: 13px;
      height: 13px;
      transition: transform 350ms var(--ease);
    }
    .enter:hover { color: #fff; transform: translateY(-1px); }
    .enter:hover .ring { background: var(--accent); border-color: var(--accent); }
    .enter:hover .ring svg { transform: translateX(3px); }

    /* ----- RIGHT: COMPOSITE DEVICE IMAGE ----- */
    .stage {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin-left: auto;
      opacity: 0;
      transform: translate3d(40px, 30px, 0) scale(0.98);
      filter: drop-shadow(0 60px 100px rgba(0, 0, 0, 0.6));
    }
    .stage img {
      width: 100%;
      height: auto;
      display: block;
    }
    body.is-ready .stage {
      animation: stageIn 1400ms var(--ease) 320ms forwards,
                 floatY 9s ease-in-out 1.8s infinite;
    }

    /* ----- KEYFRAMES ----- */
    @keyframes fadeDown { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp   { to { opacity: 1; transform: translateY(0); } }
    @keyframes titleUp  { to { opacity: 1; transform: translateY(0); } }
    @keyframes stageIn  { to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
    @keyframes floatY   {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50%      { transform: translate3d(0, -10px, 0) scale(1); }
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 1040px) {
      .cover {
        grid-template-columns: 1fr;
        gap: clamp(40px, 6vh, 72px);
        padding-top: clamp(110px, 14vh, 160px);
      }
      .stage { max-width: 680px; margin: 0 auto; order: 2; }
      .title { font-size: clamp(40px, 9vw, 68px); }
    }
    @media (max-width: 560px) {
      .brand img { height: 24px; }
      .cover { padding: clamp(100px, 14vh, 140px) 24px 60px; }
      .eyebrow { font-size: 11px; letter-spacing: 0.3em; margin-bottom: 26px; }
      .title { font-size: clamp(34px, 11vw, 52px); letter-spacing: -0.03em; }
      .lede { font-size: 14px; max-width: 100%; }
      .enter { font-size: 11px; letter-spacing: 0.22em; }
      .enter .ring { width: 34px; height: 34px; }
    }

    /* ----- REDUCED MOTION ----- */
    @media (prefers-reduced-motion: reduce) {
      body.is-ready * { animation: none !important; transition: none !important; }
      .eyebrow, .title .line > span, .lede, .enter, .stage, .brand {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <main class="slide" aria-label="Cover slide">

    <!-- TaskFlo wordmark -->
    <a class="brand" href="#" aria-label="TaskFlo">
      <img src="assets/img/cover/taskflo-logo.png" alt="TaskFlo" />
    </a>

    <div class="cover">
      <!-- LEFT: text -->
      <div class="copy">
        <div class="eyebrow">February 2026</div>

        <h1 class="title">
          <span class="line"><span>J.A.P. SENIOR</span></span>
          <span class="line"><span>CARE SERVICES</span></span>
        </h1>

        <p class="lede">
          Two complete web design directions for J.A.P. Senior Care Services &mdash; built by TaskFlo with the warmth, dignity, and clinical confidence the brand was founded on.
        </p>

        <a class="enter" href="#deck" aria-label="Enter presentation">
          <span class="ring" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </span>
          <span>Enter Presentation</span>
        </a>
      </div>

      <!-- RIGHT: composite device mockup -->
      <div class="stage" aria-hidden="true">
        <img src="assets/img/cover/devices.png" alt="J.A.P. Senior Care Services web design mockups" />
      </div>
    </div>
  </main>

  <script>
    // Two rAFs so the keyframes start from their declared "from"
    // state. Without this the browser may already have committed the
    // post-animation state before the rule cascade kicks in.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.body.classList.add('is-ready');
      });
    });
  </script>
</body>
</html>
